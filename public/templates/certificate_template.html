<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Urkunde</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

    @page {
      size: A4;
      margin: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: 'Roboto', Helvetica, sans-serif;
    }

    .page {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
    }

    /* Logo */
    .logo {
      position: absolute;
      top: -2mm;
      left: 150mm;
      width: 60mm;
      height: 60mm;
      object-fit: contain;
      z-index: 5;
    }

    /* Optional image box (like your final mock) */
    .image-box {
      position: absolute;
      top: 85mm;
      left: 50%;
      transform: translateX(-50%);
      width: 160mm;
      height: 120mm;
      background: #f3f3f3;
      border: 2px solid rgba(0, 0, 0, .15);
      border-radius: 2mm;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 4;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-fallback {
      color: rgba(0, 0, 0, .45);
      font-weight: 600;
      font-size: 14pt;
    }

    /* Text content */
    .content {
      position: absolute;
      top: 35mm;
      left: 20mm;
      right: 20mm;
      text-align: center;
      color: #111;
      z-index: 6;
    }

    .event {
      font-size: 30pt;
      font-weight: 500;
      margin-bottom: 2mm;
    }

    .title {
      font-size: 60pt;
      font-weight: 900;
      letter-spacing: .5px;
      margin: 0 0 0mm;
    }

    .team {
      font-size: 30pt;
      font-weight: 700
    }

    .rank-plaque {
      position: absolute;
      top: 215mm;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
    }

    .rank-number {
      font-size: 40pt;
      font-weight: 900;
    }

    .rank-place {
      font-size: 20pt;
      font-weight: 700;
      margin-top: -3mm;
    }

    .y {
      background: #f1e500;
    }

    .dk {
      background: #2f2f2f;
    }

    .md {
      background: #6d6d6d;
    }

    .lt {
      background: #cfcfcf;
    }

    .sstripe {
      position: absolute;
      height: 6mm;
      transform: rotate(-35deg);
      z-index: 6;
    }


    @media print {
      body {
        background: #fff;
      }

      .page {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <img class="logo" src="logo.png" alt="Logo" />


    <div class="content">
      <div class="title">URKUNDE</div>
      <div class="event">Budeturnier 2026</div>
    </div>



    <div class="image-box">
      <!-- If IMAGE_URL is empty, keep fallback visible -->
      <img src="{{IMAGE_URL}}" alt=""
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
      <div class="image-fallback" style="display:none;">No image</div>
    </div>

    <div class="rank-plaque">
      <div class="team">{{TEAM_NAME}}</div>
      <div class="rank-number">{{RANK}}. Platz</div>
      <!-- <div class="rank-place">Platz</div> -->
    </div>

    <div class="sstripe y" style="top: 77mm; left: 12mm; width: 50mm;"></div>
    <div class="sstripe lt" style="top: 85mm; left: 5mm; width: 60mm;"></div>
    <div class="sstripe dk" style="top:93mm; left: 4mm;  width: 60mm"></div>
    
    <!-- <div class="sstripe lt" style="top: 198mm; left: 142mm; width: 55mm;"></div> -->
    <div class="sstripe dk" style="top: 196mm; left: 149mm;  width: 60mm"></div>
    <div class="sstripe md" style="top: 209mm; left: 155mm; width: 50mm;"></div>
    <div class="sstripe y" style="top: 208mm; left: 150mm; width: 45mm;"></div>
    <!-- <div class="sstripe md" style="top: 202mm; left: 150mm; width: 60mm; height: 7mm;"></div> -->

    <div class="image-box" style="top: auto; bottom: -6mm; height: 70mm; width: 230mm; border: none;">
      <img src="skyline.png" alt="Skyline" />
    </div>
</body>

</html>
