# Upstream for Node.js app
upstream app_backend {
    server app:3000;
    keepalive 32;
}

# Upstream for WebSocket server (Socket.IO runs on separate port)
upstream websocket_backend {
    server app:2053;
    keepalive 32;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name budescharfeseck.de www.budescharfeseck.de;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name budescharfeseck.de www.budescharfeseck.de;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/budescharfeseck.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budescharfeseck.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/include.conf;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;
    limit_conn addr 10;

    # Static files - served directly by Nginx
    location /public/ {
        alias /usr/share/nginx/html/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /src/public/ {
        alias /usr/share/nginx/html/src/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint (bypass ModSecurity)
    location /health {
        modsecurity off;
        proxy_pass http://app_backend;
        access_log off;
    }

    # WebSocket upgrade for Socket.IO
    location /socket.io/ {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket timeout
        proxy_read_timeout 86400;
    }

    # Proxy all other requests to Node.js app
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
