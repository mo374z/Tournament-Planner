# =====================================================================
# Turnier-Template V1: 4 Gruppen à 4 Teams, Viertelfinale bis Finale
# (Standardablauf). Das Spiel um den letzten Platz steht VOR dem Finale,
# die Platzierungsspiele haben feste Paarungen (kein Gegnertausch).
# Neuere Varianten: 4groups_4teams_v3.yaml (Spiel um letzten Platz am Ende)
# und 4groups_4teams_v4.yaml (zusätzlich mit Gegnertausch).
#
# Alle Einstellungen dieser Datei werden von ScheduleGenerator und GameController
# gelesen. Die ausführliche Erklärung aller Felder steht in 4groups_4teams_v4.yaml.
# Spieldauern und Pausen kommen aus den Haupteinstellungen (MainSettings);
# das Template verweist nur über "duration_setting" darauf.
#
# Quellen für Teilnehmer eines Spiels (home / away):
#   { type: group_rank, group: "A", rank: 1 }  -> Platz in der Gruppentabelle
#   { type: winner, match: "QF1" }             -> Sieger eines anderen Spiels
#   { type: loser, match: "SF1" }              -> Verlierer eines anderen Spiels
#   { type: pool_rank, pool: "qf_losers", rank: 1 } -> Platz in einem Pool
#   { type: overall_rank, rank: 9 }            -> Platz der Gesamtwertung nach der Gruppenphase
#   { type: team, name: "..." }                -> Fest zugewiesenes Team
# =====================================================================

schema_version: 1

meta:
  name: "16 Teams, 4 Gruppen à 4 Teams (V1, Standard)" # Anzeigename in der Template-Auswahl
  description: >-
    V1 - Standardablauf: 16 Teams in 4 Gruppen (jeder gegen jeden), die besten 2 jeder Gruppe spielen
    Viertelfinale, Halbfinale und Finale. Alle anderen Plätze werden über Platzierungsspiele ausgespielt.
    Das Spiel um den letzten Platz (15/16) steht VOR dem Finale. Feste Paarungen, kein Gegnertausch
    (Teams derselben Gruppe können in Platzierungsspielen aufeinandertreffen).
  total_teams: 16

group_stage:
  enabled: true
  game_phase_key: "Group_Stage"
  display_name: "Gruppenspiel"
  duration_setting: "gameDurationGroupStage"
  groups:
    - { name: "A", teams: 4 }
    - { name: "B", teams: 4 }
    - { name: "C", teams: 4 }
    - { name: "D", teams: 4 }
  format:
    type: "round_robin"
    legs: 1
    game_order: "by_round" # Runde 1 aller Gruppen, dann Runde 2, ...
    group_order: "sequential"
    seeding: "sequential"
  points:
    win: 3
    draw: 1
    loss: 0
  ranking:
    tiebreakers: ["points", "goal_difference", "goals_scored", "head_to_head"]
    final_tiebreak: "manual"
  advancement:
    spots_per_group: 2
    best_of_rank:
      rank: 3
      count: 0

pools:
  qf_losers:
    display_name: "Viertelfinale"
    teams_from: { type: "losers_of_phase", phase: "quarterfinals" }
    then: ["points", "goal_difference", "goals_scored"]

opponent_swap:
  enabled: false # V1: feste Paarungen

knockout_stage:
  enabled: true
  draw_resolution:
    order: ["extra_time", "penalties"]
    require_winner: true # K.o.-Spiele können bei Gleichstand nicht beendet werden
  phases:
    - id: "quarterfinals"
      enabled: true
      game_phase_key: "Quarterfinals"
      display_name: "Viertelfinale"
      duration_setting: "gameDurationQuarterfinals"
      matches:
        - { id: "QF1", home: { type: group_rank, group: "A", rank: 1 }, away: { type: group_rank, group: "D", rank: 2 } }
        - { id: "QF2", home: { type: group_rank, group: "B", rank: 1 }, away: { type: group_rank, group: "C", rank: 2 } }
        - { id: "QF3", home: { type: group_rank, group: "C", rank: 1 }, away: { type: group_rank, group: "B", rank: 2 } }
        - { id: "QF4", home: { type: group_rank, group: "D", rank: 1 }, away: { type: group_rank, group: "A", rank: 2 } }
    - id: "semifinals"
      enabled: true
      game_phase_key: "Semifinals"
      display_name: "Halbfinale"
      duration_setting: "gameDurationSemifinals"
      matches:
        - { id: "SF1", home: { type: winner, match: "QF1" }, away: { type: winner, match: "QF3" } }
        - { id: "SF2", home: { type: winner, match: "QF2" }, away: { type: winner, match: "QF4" } }
    - id: "finals"
      enabled: true
      game_phase_key: "Finals"
      duration_setting: "gameDurationFinal"
      matches:
        - { id: "P13", display_name: "Platzierungsspiel 13-14", final_placement: 13, home: { type: overall_rank, rank: 13 }, away: { type: overall_rank, rank: 14 } }
        - { id: "P11", display_name: "Platzierungsspiel 11-12", final_placement: 11, home: { type: overall_rank, rank: 11 }, away: { type: overall_rank, rank: 12 } }
        - { id: "P9", display_name: "Platzierungsspiel 9-10", final_placement: 9, home: { type: overall_rank, rank: 9 }, away: { type: overall_rank, rank: 10 } }
        - { id: "P7", display_name: "Platzierungsspiel 7-8", final_placement: 7, home: { type: pool_rank, pool: "qf_losers", rank: 3 }, away: { type: pool_rank, pool: "qf_losers", rank: 4 } }
        - { id: "P5", display_name: "Platzierungsspiel 5-6", final_placement: 5, home: { type: pool_rank, pool: "qf_losers", rank: 1 }, away: { type: pool_rank, pool: "qf_losers", rank: 2 } }
        - { id: "BRONZE", display_name: "Spiel um Platz 3", final_placement: 3, home: { type: loser, match: "SF1" }, away: { type: loser, match: "SF2" } }
        - { id: "P15", display_name: "Spiel um letzten Platz", final_placement: 15, home: { type: overall_rank, rank: 15 }, away: { type: overall_rank, rank: 16 } }
        - { id: "FINAL", display_name: "Finale", final_placement: 1, home: { type: winner, match: "SF1" }, away: { type: winner, match: "SF2" } }

final_ranking:
  overall_rank_mode: "qualified_first" # Weitergekommene Teams stehen vor allen anderen
  qualified_sort: ["points_general", "goal_difference_general", "goals_scored_general"]
  non_qualified_sort: ["points", "goal_difference", "goals_scored"]
  placement_source: "match_final_placement"

display:
  placeholders:
    group_rank: "{rank}. aus Gruppe {group}"
    winner: "Sieger {match_name}"
    loser: "Verlierer {match_name}"
    overall_rank: "{rank}. Gesamtwertung"
    pool_rank: "{rank}. Verlierer {pool_name}"
